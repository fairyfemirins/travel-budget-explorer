<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Budget Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Travel Budget Explorer</h1>
        <p class="text-center mb-5">Enter your budget and departure date to discover destinations you can afford.</p>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="search-form">
                    <div class="mb-3">
                        <label for="budget" class="form-label">Budget (USD)</label>
                        <input type="number" class="form-control" id="budget" placeholder="e.g., 500" required>
                    </div>
                    <div class="mb-3">
                        <label for="departure-date" class="form-label">Departure Date</label>
                        <input type="date" class="form-control" id="departure-date" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Explore Destinations</button>
                </form>
            </div>
        </div>

        <div class="row mt-5" id="results-container">
            <!-- Results will be loaded here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
