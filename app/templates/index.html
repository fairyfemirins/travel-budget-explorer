<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Budget Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 2rem; }
        .result-card { margin: 1rem 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Travel Budget Explorer</h1>
        <form id="searchForm" class="row g-3">
            <div class="col-md-3">
                <label for="departure" class="form-label">Departure City</label>
                <input type="text" class="form-control" id="departure" value="NYC" required>
            </div>
            <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" value="2026-12-01" required>
            </div>
            <div class="col-md-3">
                <label for="budget" class="form-label">Budget ($)</label>
                <input type="number" class="form-control" id="budget" value="1000" required>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
        </form>
        
        <div id="results" class="mt-4">
            <!-- Results injected here -->
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const departure = document.getElementById('departure').value;
            const date = document.getElementById('date').value;
            const budget = document.getElementById('budget').value;
            
            const response = await fetch(`/search?departure=${departure}&date=${date}&budget=${budget}`);
            const results = await response.json();
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = results.length
                ? results.map(result => `
                    <div class="card result-card">
                        <div class="card-body">
                            <h5 class="card-title">${result.destination}</h5>
                            <p class="card-text">
                                <strong>Price:</strong> $${result.price}<br>
                                <strong>Continent:</strong> ${result.continent}<br>
                                <strong>Climate:</strong> ${result.climate}
                            </p>
                        </div>
                    </div>
                `).join('')
                : '<div class="alert alert-info">No destinations found under your budget.</div>';
        });
    </script>
</body>
</html>
