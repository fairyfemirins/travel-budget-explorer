<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Budget Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0;
            margin-bottom: 30px;
            text-align: center;
        }
        .result-card {
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .result-card:hover {
            transform: translateY(-5px);
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        footer {
            margin-top: 50px;
            padding: 20px 0;
            background-color: #343a40;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <h1 class="display-4 fw-bold">Travel Budget Explorer</h1>
            <p class="lead">Enter your budget and travel date to discover destinations you can afford.</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="searchForm">
                            <div class="mb-3">
                                <label for="budget" class="form-label">Budget ($)</label>
                                <input type="number" class="form-control" id="budget" name="budget" min="50" step="10" required>
                            </div>
                            <div class="mb-3">
                                <label for="departure_date" class="form-label">Departure Date</label>
                                <input type="date" class="form-control" id="departure_date" name="departure_date" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Search Destinations</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4" id="results">
            <!-- Results will be displayed here -->
        </div>
    </div>

    <footer>
        <div class="container">
            <p class="mb-0">Built by Femirins | <a href="https://github.com/fairyfemirins/travel-budget-explorer" class="text-white">GitHub</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const budget = document.getElementById('budget').value;
            const departure_date = document.getElementById('departure_date').value;
            
            const response = await fetch('/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `budget=${budget}&departure_date=${departure_date}`
            });
            
            const results = await response.json();
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';
            
            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info">No destinations found within your budget. Try increasing your budget.</div>
                    </div>
                `;
                return;
            }
            
            results.forEach(dest => {
                resultsContainer.innerHTML += `
                    <div class="col-md-4">
                        <div class="result-card card">
                            <img src="${dest.image_url}" class="card-img-top" alt="${dest.destination}">
                            <div class="card-body">
                                <h5 class="card-title">${dest.destination}</h5>
                                <p class="card-text">
                                    <strong>Price:</strong> $${dest.price}<br>
                                    <strong>Airline:</strong> ${dest.airline}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
